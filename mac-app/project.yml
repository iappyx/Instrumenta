# project.yml – XcodeGen Konfiguration für InfrontToolkit macOS App
# Alternative zum manuellen project.pbxproj.
#
# Installation: brew install xcodegen
# Verwendung:   cd mac-app && xcodegen generate
#
# XcodeGen generiert aus dieser Datei ein vollständiges .xcodeproj.
# Vorteil: Versionierbar, lesbar, merge-freundlich.

name: InfrontToolkit

options:
  bundleIdPrefix: com.infront
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  defaultConfig: Release
  developmentLanguage: de

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"

targets:
  InfrontToolkit:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    info:
      path: InfrontToolkit/Info.plist

    entitlements:
      path: InfrontToolkit/InfrontToolkit.entitlements

    sources:
      - path: InfrontToolkit
        excludes:
          - "Resources/addin-dist/**"
        createIntermediateGroups: true

    resources:
      - InfrontToolkit/Resources/manifest-template.xml
      - InfrontToolkit/Assets.xcassets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infront.toolkit
        PRODUCT_NAME: InfrontToolkit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          DEBUG_INFORMATION_FORMAT: dwarf
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
